<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부캉이 피하기 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #071928;
            font-family: '맑은 고딕', sans-serif;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #lobby-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(7, 25, 40, 0.72);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 20;
            backdrop-filter: blur(5px);
        }

        #lobby-title {
            font-size: 70px;
            color: #00f5d4;
            font-weight: bold;
            text-shadow: 0 0 20px #00f5d4, 0 0 40px #0077b6;
            margin-bottom: 15px;
            text-align: center;
        }

        #lobby-desc {
            font-size: 20px;
            color: #e0f7fa;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 35px;
            text-shadow: 2px 2px 4px #000;
        }

        .controls-box {
            margin: 16px auto;
            padding: 14px 28px;
            background: rgba(0, 15, 30, 0.6);
            border: 1px solid rgba(0, 245, 212, 0.4);
            border-radius: 12px;
            display: inline-block;
            font-size: 18px;
            line-height: 1.8;
            text-align: left;
        }

        .lang-tag {
            color: #00f5d4;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
            width: 45px;
        }

        .highlight { color: #ffb703; font-weight: bold; }

        #start-btn {
            padding: 15px 60px;
            font-size: 28px;
            font-weight: bold;
            color: #071928;
            background-color: #00f5d4;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #00f5d4;
            transition: all 0.2s;
        }

        #start-btn:hover {
            background-color: #fff;
            box-shadow: 0 0 40px #fff;
            transform: scale(1.05);
        }

        #exp-display {
            position: absolute;
            top: 20px; left: 25px;
            color: #00f5d4;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 6px #000;
            display: none;
        }

        #jump-indicator {
            position: absolute;
            top: 58px; left: 25px;
            color: #ffb703;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 4px #000;
            display: none;
        }

        #zone-banner {
            position: absolute;
            top: 18%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd166;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 209, 102, 0.8), 2px 2px 0 #000;
            opacity: 0;
            transition: opacity 0.4s;
            text-align: center;
        }

        #message-display {
            position: absolute;
            top: 35%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 65px;
            font-weight: bold;
            text-shadow: 3px 3px 0px #000;
            display: none;
            text-align: center;
        }

        #restart-btn {
            position: absolute;
            top: 55%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background-color: #d90429;
            border: 3px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            pointer-events: auto;
            box-shadow: 0 0 15px #d90429;
            transition: all 0.2s;
        }

        #restart-btn:hover {
            background-color: #ffb703;
            box-shadow: 0 0 25px #ffb703;
            color: #071928;
            border-color: #071928;
        }
    </style>
</head>
<body>
    <div id="lobby-screen">
        <div id="lobby-title">부캉이 피하기 3D</div>
        <div id="lobby-desc">
            출렁이는 바다 위, 상어를 피해 살아남으세요!<br>
            <div class="controls-box">
                <div><span class="lang-tag">[KR]</span><span class="highlight">[A / D (꾹 누르기)] 연속 이동 &nbsp;|&nbsp; [Space x1~2] 1단·2단 점프</span></div>
                <div><span class="lang-tag">[EN]</span><span class="highlight">[A / D (Hold)] Move &nbsp;|&nbsp; [Space x1~2] Single / Double Jump</span></div>
                <div><span class="lang-tag">[JP]</span><span class="highlight">[A / D (長押し)] 連続移動 &nbsp;|&nbsp; [Space x1~2] 1段・2段ジャンプ</span></div>
            </div><br>
            높은 2층 장애물은 <b>공중에서 Space를 한 번 더</b> 눌러 넘어야 합니다!
        </div>
        <button id="start-btn">게임 시작</button>
    </div>

    <div id="ui-layer">
        <div id="exp-display">경험치: <span id="exp-value">0</span></div>
        <div id="jump-indicator">점프: ● ●</div>
        <div id="zone-banner"></div>
        <div id="message-display"></div>
        <button id="restart-btn">다시하기 [Enter]</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. 3D 공간 및 분위기 설정 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#0b4f6c');
        scene.fog = new THREE.FogExp2('#0b4f6c', 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5.2, 12.2);
        camera.lookAt(0, 0.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. 바다 조명 ---
        const ambientLight = new THREE.AmbientLight(0x8ecae6, 0.65);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xfff3b0, 0.95);
        directionalLight.position.set(15, 25, 12);
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0x00b4d8, 0.4);
        backLight.position.set(-15, 10, -20);
        scene.add(backLight);

        // --- 3. 진짜 바다 느낌의 3D 출렁이는 파도 & 해상 배경 오브젝트 ---
        const oceanGeo = new THREE.PlaneGeometry(180, 260, 44, 60);
        oceanGeo.rotateX(-Math.PI / 2);
        const oceanMat = new THREE.MeshStandardMaterial({
            color: '#0081a7',
            emissive: '#000000',
            roughness: 0.35,
            metalness: 0.1,
            flatShading: true
        });
        const ocean = new THREE.Mesh(oceanGeo, oceanMat);
        scene.add(ocean);

        const oceanPos = oceanGeo.attributes.position;
        const baseOceanCoords = [];
        for (let i = 0; i < oceanPos.count; i++) {
            baseOceanCoords.push({
                x: oceanPos.getX(i),
                z: oceanPos.getZ(i)
            });
        }

        // 차선 구분 물거품 라인
        const laneMarkerGroup = new THREE.Group();
        const foamMat = new THREE.MeshBasicMaterial({ color: 0xade8f4, transparent: true, opacity: 0.35 });
        for (let x of [-1.5, 1.5]) {
            for (let z = -110; z <= 15; z += 4) {
                const stripGeo = new THREE.BoxGeometry(0.12, 0.04, 1.6);
                const strip = new THREE.Mesh(stripGeo, foamMat);
                strip.position.set(x, 0.06, z);
                laneMarkerGroup.add(strip);
            }
        }
        scene.add(laneMarkerGroup);

        // 해상 배경 오브젝트 3종 (야자수 섬, 등대 부표, 난파선)
        const seaProps = [];

        function createPalmIsland() {
            const group = new THREE.Group();

            const sandGeo = new THREE.CylinderGeometry(2.8, 3.8, 0.7, 9);
            const sandMat = new THREE.MeshStandardMaterial({ color: '#f4d58d', flatShading: true });
            const sand = new THREE.Mesh(sandGeo, sandMat);
            sand.position.y = 0.25;
            group.add(sand);

            const trunkMat = new THREE.MeshStandardMaterial({ color: '#7f4f24', flatShading: true });
            for (let i = 0; i < 4; i++) {
                const segGeo = new THREE.CylinderGeometry(0.22 - i * 0.02, 0.26 - i * 0.02, 1.1, 6);
                const seg = new THREE.Mesh(segGeo, trunkMat);
                seg.position.set(i * 0.14, 0.9 + i * 0.95, 0);
                seg.rotation.z = -0.12 * i;
                group.add(seg);
            }

            const leafMat = new THREE.MeshStandardMaterial({ color: '#52b788', flatShading: true });
            for (let i = 0; i < 6; i++) {
                const leafGeo = new THREE.ConeGeometry(0.55, 2.4, 4);
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                const angle = (i / 6) * Math.PI * 2;
                leaf.position.set(0.45 + Math.cos(angle) * 0.9, 4.3, Math.sin(angle) * 0.9);
                leaf.rotation.z = -Math.PI / 2.6;
                leaf.rotation.y = -angle;
                group.add(leaf);
            }

            return group;
        }

        function createSeaLighthouse() {
            const group = new THREE.Group();

            const baseGeo = new THREE.CylinderGeometry(1.8, 2.2, 0.8, 8);
            const baseMat = new THREE.MeshStandardMaterial({ color: '#2b2d42', flatShading: true });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.3;
            group.add(base);

            const redMat = new THREE.MeshStandardMaterial({ color: '#e63946', flatShading: true });
            const whiteMat = new THREE.MeshStandardMaterial({ color: '#f1faee', flatShading: true });
            for (let i = 0; i < 4; i++) {
                const towerGeo = new THREE.CylinderGeometry(1.1 - i * 0.15, 1.25 - i * 0.15, 1.2, 8);
                const tower = new THREE.Mesh(towerGeo, i % 2 === 0 ? redMat : whiteMat);
                tower.position.y = 1.2 + i * 1.15;
                group.add(tower);
            }

            const lightGeo = new THREE.SphereGeometry(0.55, 8, 8);
            const lightMat = new THREE.MeshBasicMaterial({ color: '#ffd166' });
            const beacon = new THREE.Mesh(lightGeo, lightMat);
            beacon.position.y = 5.5;
            group.add(beacon);

            const roofGeo = new THREE.ConeGeometry(0.8, 0.9, 8);
            const roof = new THREE.Mesh(roofGeo, redMat);
            roof.position.y = 6.2;
            group.add(roof);

            return group;
        }

        function createShipwreck() {
            const group = new THREE.Group();
            const woodMat = new THREE.MeshStandardMaterial({ color: '#582f0e', flatShading: true });
            const darkWoodMat = new THREE.MeshStandardMaterial({ color: '#331d0c', flatShading: true });
            const tornSailMat = new THREE.MeshStandardMaterial({ color: '#adb5bd', flatShading: true });

            const hullGeo = new THREE.BoxGeometry(2.2, 1.2, 5.2);
            const hull = new THREE.Mesh(hullGeo, woodMat);
            hull.position.y = 0.3;
            group.add(hull);

            const mastGeo = new THREE.CylinderGeometry(0.12, 0.16, 4.2, 6);
            const mast = new THREE.Mesh(mastGeo, darkWoodMat);
            mast.position.set(0, 2.1, -0.4);
            mast.rotation.z = 0.25;
            group.add(mast);

            const sailGeo = new THREE.ConeGeometry(1.4, 2.2, 3);
            const sail = new THREE.Mesh(sailGeo, tornSailMat);
            sail.position.set(0.3, 2.3, -0.4);
            sail.rotation.y = Math.PI / 2;
            sail.rotation.z = 0.25;
            group.add(sail);

            group.rotation.set(0.28, Math.random() * Math.PI, 0.35);
            return group;
        }

        function spawnSeaProp(side, zPos) {
            const pick = Math.floor(Math.random() * 3);
            let prop;
            if (pick === 0) prop = createPalmIsland();
            else if (pick === 1) prop = createSeaLighthouse();
            else prop = createShipwreck();

            const xPos = side * (12 + Math.random() * 14);
            prop.position.set(xPos, 0, zPos);
            scene.add(prop);
            seaProps.push({ mesh: prop, phase: Math.random() * Math.PI * 2 });
        }

        for (let i = 0; i < 14; i++) {
            spawnSeaProp(i % 2 === 0 ? -1 : 1, -20 - i * 18);
        }

        // 물보라(물거품) 파티클 시스템
        const wakeParticles = [];
        const wakeGeo = new THREE.BoxGeometry(0.18, 0.18, 0.18);
        const wakeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });

        function spawnWake(x, y, z, spread = 0.4, speedY = 0.04) {
            const p = new THREE.Mesh(wakeGeo, wakeMat.clone());
            p.position.set(
                x + (Math.random() - 0.5) * spread,
                y + 0.1,
                z + (Math.random() - 0.5) * spread
            );
            scene.add(p);
            wakeParticles.push({
                mesh: p,
                vx: (Math.random() - 0.5) * 0.06,
                vy: speedY + Math.random() * 0.04,
                vz: 0.15,
                life: 1.0
            });
        }

        // --- 4. 플레이어 (배) ---
        function createBoat() {
            const group = new THREE.Group();
            const hullMat = new THREE.MeshStandardMaterial({ color: '#8b5a2b', flatShading: true });
            
            const backGeo = new THREE.BoxGeometry(1.4, 0.6, 1.6);
            const back = new THREE.Mesh(backGeo, hullMat);
            back.position.set(0, 0.3, 0.4);
            group.add(back);

            const frontGeo = new THREE.ConeGeometry(0.7, 1.2, 4);
            const front = new THREE.Mesh(frontGeo, hullMat);
            front.rotation.x = -Math.PI / 2;
            front.rotation.z = Math.PI / 4; 
            front.scale.set(1, 1, 0.6); 
            front.position.set(0, 0.3, -0.8);
            group.add(front);

            const mastGeo = new THREE.CylinderGeometry(0.05, 0.05, 2);
            const mastMat = new THREE.MeshStandardMaterial({ color: '#5c4033' });
            const mast = new THREE.Mesh(mastGeo, mastMat);
            mast.position.set(0, 1.3, 0.2);
            group.add(mast);

            const sailGeo = new THREE.ConeGeometry(0.8, 1.6, 3);
            const sailMat = new THREE.MeshStandardMaterial({ color: '#fff8e7', flatShading: true });
            const sail = new THREE.Mesh(sailGeo, sailMat);
            sail.position.set(0, 1.2, -0.1);
            sail.rotation.y = -Math.PI / 2; 
            group.add(sail);

            return group;
        }

        const lanes = [-3, 0, 3];
        let currentLane = 1;
        const playerBaseY = 0;

        const player = createBoat();
        player.position.set(lanes[currentLane], playerBaseY, 5);
        scene.add(player);

        // --- 5. 상어 모델 생성 함수 ---
        function createLowPolySharkModel() {
            const group = new THREE.Group();
            
            const topSkinMat = new THREE.MeshStandardMaterial({ color: '#6c757d', flatShading: true }); 
            const bellyMat = new THREE.MeshStandardMaterial({ color: '#eef0f2', flatShading: true }); 
            const eyeMat = new THREE.MeshBasicMaterial({ color: '#000000' }); 
            
            const bodyGeo = new THREE.SphereGeometry(1, 10, 6);
            const body = new THREE.Mesh(bodyGeo, topSkinMat);
            body.scale.set(0.8, 0.8, 2.0);
            body.position.set(0, 0.3, 0);
            group.add(body);

            const bellyGeo = new THREE.SphereGeometry(0.95, 10, 6);
            const belly = new THREE.Mesh(bellyGeo, bellyMat);
            belly.scale.set(0.78, 0.55, 1.95);
            belly.position.set(0, 0.1, 0);
            group.add(belly);

            const snoutGeo = new THREE.ConeGeometry(0.75, 1.8, 8);
            const snout = new THREE.Mesh(snoutGeo, topSkinMat);
            snout.rotation.x = -Math.PI / 2;
            snout.position.set(0, 0.25, -1.5);
            snout.scale.set(0.95, 0.7, 1);
            group.add(snout);

            const snoutBelly = new THREE.Mesh(snoutGeo, bellyMat);
            snoutBelly.rotation.x = -Math.PI / 2;
            snoutBelly.position.set(0, 0.1, -1.45);
            snoutBelly.scale.set(0.9, 0.5, 0.9);
            group.add(snoutBelly);

            const eyeGeo = new THREE.SphereGeometry(0.07, 6, 6);
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.45, 0.35, -1.2);
            group.add(leftEye);

            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.45, 0.35, -1.2);
            group.add(rightEye);

            const dorsalGeo = new THREE.ConeGeometry(0.35, 1.3, 4);
            const dorsal = new THREE.Mesh(dorsalGeo, topSkinMat);
            dorsal.position.set(0, 1.3, 0.2);
            dorsal.rotation.x = -0.35;
            group.add(dorsal);

            const finGeo = new THREE.ConeGeometry(0.5, 1.6, 4);
            const leftFin = new THREE.Mesh(finGeo, topSkinMat);
            leftFin.position.set(-0.9, 0.0, -0.2);
            leftFin.rotation.z = Math.PI / 2.8;
            leftFin.rotation.x = 0.2;
            group.add(leftFin);

            const rightFin = new THREE.Mesh(finGeo, topSkinMat);
            rightFin.position.set(0.9, 0.0, -0.2);
            rightFin.rotation.z = -Math.PI / 2.8;
            rightFin.rotation.x = 0.2;
            group.add(rightFin);

            const tailFinGeo = new THREE.ConeGeometry(0.3, 2.2, 4);
            const tailFin = new THREE.Mesh(tailFinGeo, topSkinMat);
            tailFin.position.set(0, 0.4, 2.3);
            tailFin.rotation.x = -0.2;
            group.add(tailFin);

            return group;
        }

        const shark = createLowPolySharkModel();
        shark.scale.set(0.45, 0.45, 0.45);
        shark.position.set(0, 0.2, 9); 
        scene.add(shark);

        function createObstacleShark(isTall) {
            const obstacleGroup = createLowPolySharkModel();
            
            const mouthMat = new THREE.MeshStandardMaterial({ color: '#590d22', flatShading: true });
            const mouthGeo = new THREE.BoxGeometry(0.65, 0.25, 0.65);
            const mouth = new THREE.Mesh(mouthGeo, mouthMat);
            mouth.position.set(0, -0.05, -1.6);
            obstacleGroup.add(mouth);

            if (isTall) {
                obstacleGroup.scale.set(0.8, 0.8, 0.8);
                obstacleGroup.position.y = 1.6;
                obstacleGroup.rotation.set(0.25, Math.PI, 0);
            } else {
                obstacleGroup.scale.set(0.55, 0.55, 0.55);
                obstacleGroup.rotation.y = Math.PI;
            }
            
            return obstacleGroup;
        }

        // --- 6. 게임 상태 및 조작 변수 ---
        const lobbyScreen = document.getElementById('lobby-screen');
        const startBtn = document.getElementById('start-btn');
        const expDisplay = document.getElementById('exp-display');
        const expValueSpan = document.getElementById('exp-value');
        const jumpIndicator = document.getElementById('jump-indicator');
        const zoneBanner = document.getElementById('zone-banner');
        const messageDisplay = document.getElementById('message-display');
        const restartBtn = document.getElementById('restart-btn');
        
        let isGameStarted = false; 
        let isGameOver = false;
        
        let obstacles = [];
        let exp = 0;
        let frameCount = 0;

        let isJumping = false;
        let jumpCount = 0;
        const maxJumps = 2;
        let jumpVelocity = 0;
        const gravity = -0.022;
        let doubleJumpSpin = 0;

        const keysHeld = { left: false, right: false };
        let laneMoveTimer = 0;
        const laneMoveDelay = 11;

        let currentObsSpeed = 0.9;
        let spawnInterval = 52;
        let waveScroll = 0;
        let currentWavePower = 1.0;
        let targetSharkZ = 9.0;

        function updateJumpUI() {
            const left = maxJumps - jumpCount;
            if (left === 2) jumpIndicator.innerText = "점프: ● ●";
            else if (left === 1) jumpIndicator.innerText = "점프: ● ○ (2단 점프 가능!)";
            else jumpIndicator.innerText = "점프: ○ ○";
        }

        function triggerJump() {
            if (jumpCount < maxJumps) {
                isJumping = true;
                jumpCount++;
                jumpVelocity = jumpCount === 1 ? 0.33 : 0.35;
                updateJumpUI();

                for (let i = 0; i < (jumpCount === 2 ? 12 : 6); i++) {
                    spawnWake(player.position.x, player.position.y, player.position.z, 1.0, 0.08);
                }
                if (jumpCount === 2) {
                    doubleJumpSpin = Math.PI * 2;
                }
            }
        }

        // --- 7. 시작 및 조작 이벤트 ---
        startBtn.addEventListener('click', () => {
            lobbyScreen.style.display = 'none';
            expDisplay.style.display = 'block';
            jumpIndicator.style.display = 'block';
            isGameStarted = true;
        });

        window.addEventListener('keydown', (e) => {
            if (isGameOver && e.key === 'Enter') {
                restartBtn.click();
                return;
            }

            if (!isGameStarted || isGameOver) return;

            const key = e.key.toLowerCase();

            if (key === 'a' || e.key === 'ArrowLeft') {
                if (!keysHeld.left) {
                    keysHeld.left = true;
                    if (currentLane > 0) {
                        currentLane--;
                        player.rotation.z = 0.25;
                    }
                    laneMoveTimer = laneMoveDelay;
                }
            } else if (key === 'd' || e.key === 'ArrowRight') {
                if (!keysHeld.right) {
                    keysHeld.right = true;
                    if (currentLane < 2) {
                        currentLane++;
                        player.rotation.z = -0.25;
                    }
                    laneMoveTimer = laneMoveDelay;
                }
            } else if (e.code === 'Space' && !e.repeat) {
                triggerJump();
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || e.key === 'ArrowLeft') {
                keysHeld.left = false;
            }
            if (key === 'd' || e.key === 'ArrowRight') {
                keysHeld.right = false;
            }
            if (!keysHeld.left && !keysHeld.right && !isGameOver) {
                player.rotation.z = 0;
            }
        });

        // --- 8. 1층 및 2층 장애물 생성 함수 ---
        function createBuoy(isTall) {
            const group = new THREE.Group();
            const redMat = new THREE.MeshStandardMaterial({ color: '#d90429', flatShading: true });
            const whiteMat = new THREE.MeshStandardMaterial({ color: '#ffffff', flatShading: true });
            const goldMat = new THREE.MeshBasicMaterial({ color: '#ffb703' });

            const count = isTall ? 2 : 1;
            for (let i = 0; i < count; i++) {
                const offsetY = i * 1.75;
                const baseGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 12);
                const base = new THREE.Mesh(baseGeo, redMat);
                base.position.y = 0.5 + offsetY;
                group.add(base);

                const stripeGeo = new THREE.CylinderGeometry(0.52, 0.52, 0.3, 12);
                const stripe = new THREE.Mesh(stripeGeo, whiteMat);
                stripe.position.y = 0.5 + offsetY;
                group.add(stripe);

                const topGeo = new THREE.ConeGeometry(0.5, 0.9, 12);
                const top = new THREE.Mesh(topGeo, i === 1 ? goldMat : redMat);
                top.position.y = 1.45 + offsetY;
                group.add(top);
            }

            return group;
        }

        function createJellyfish(isTall) {
            const group = new THREE.Group();
            const jellyMat = new THREE.MeshStandardMaterial({ 
                color: isTall ? '#ff006e' : '#b5179e', 
                transparent: true, 
                opacity: 0.85,
                flatShading: true
            });

            const count = isTall ? 2 : 1;
            for (let c = 0; c < count; c++) {
                const offsetY = c * 1.7;
                const headGeo = new THREE.SphereGeometry(0.7, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2);
                const head = new THREE.Mesh(headGeo, jellyMat);
                head.position.y = 1.2 + offsetY;
                group.add(head);

                const legGeo = new THREE.CylinderGeometry(0.05, 0.05, 1);
                for (let i = 0; i < 4; i++) {
                    const leg = new THREE.Mesh(legGeo, jellyMat);
                    leg.position.x = Math.cos((i / 4) * Math.PI * 2) * 0.3;
                    leg.position.z = Math.sin((i / 4) * Math.PI * 2) * 0.3;
                    leg.position.y = 0.5 + offsetY;
                    group.add(leg);
                }
            }
            return group;
        }

        function spawnObstacle() {
            if (!isGameStarted || isGameOver) return;
            
            const laneIdx = Math.floor(Math.random() * 3);
            const rand = Math.random();
            const isTall = exp >= 3 && Math.random() < 0.38;
            let obsMesh, obsType;
            
            if (rand < 0.33) {
                obsMesh = createBuoy(isTall);
                obsType = '부표';
            } else if (rand < 0.66) {
                obsMesh = createJellyfish(isTall);
                obsType = '해파리';
            } else {
                obsMesh = createObstacleShark(isTall);
                obsType = '상어';
            }
            
            obsMesh.position.set(lanes[laneIdx], 0, -85); 
            scene.add(obsMesh);
            
            obstacles.push({ 
                mesh: obsMesh, 
                lane: laneIdx, 
                passed: false, 
                type: obsType,
                isTall: isTall
            });
        }

        // [교체된 구간 테마] 바다 분위기 + 파도 높이 + 상어 추격 거리가 함께 변하는 4개 해역
        const oceanThemes = [
            {
                bg: '#0b4f6c',
                water: '#0081a7',
                emissive: '#000000',
                sun: '#fff3b0',
                wavePower: 1.0,
                sharkZ: 9.0,
                banner: '산호초 맑은 바다'
            },
            {
                bg: '#4a1942',
                water: '#893168',
                emissive: '#1a0514',
                sun: '#ff9e00',
                wavePower: 1.35,
                sharkZ: 8.6,
                banner: '붉은 노을 해협 (파도 상승!)'
            },
            {
                bg: '#1b263b',
                water: '#0d1b2a',
                emissive: '#000000',
                sun: '#778da9',
                wavePower: 2.1,
                sharkZ: 8.2,
                banner: '폭풍우 소용돌이 해역 (거친 파도!)'
            },
            {
                bg: '#03071e',
                water: '#003566',
                emissive: '#003f5c',
                sun: '#00f5d4',
                wavePower: 1.6,
                sharkZ: 7.8,
                banner: '발광 심연 (상어가 바짝 추격합니다!)'
            }
        ];

        function applyOceanTheme(theme) {
            scene.background.set(theme.bg);
            scene.fog.color.set(theme.bg);
            oceanMat.color.set(theme.water);
            oceanMat.emissive.set(theme.emissive);
            directionalLight.color.set(theme.sun);
            currentWavePower = theme.wavePower;
            targetSharkZ = theme.sharkZ;
        }

        function showZoneBanner(text) {
            zoneBanner.innerText = text;
            zoneBanner.style.opacity = '1';
            setTimeout(() => {
                zoneBanner.style.opacity = '0';
            }, 2200);
        }

        // --- 9. 다시하기 기능 ---
        restartBtn.addEventListener('click', () => {
            obstacles.forEach(obs => scene.remove(obs.mesh));
            obstacles = [];

            wakeParticles.forEach(p => scene.remove(p.mesh));
            wakeParticles.length = 0;

            isGameOver = false;
            exp = 0;
            frameCount = 0;
            currentLane = 1;
            isJumping = false;
            jumpCount = 0;
            doubleJumpSpin = 0;
            keysHeld.left = false;
            keysHeld.right = false;
            
            currentObsSpeed = 0.9;
            spawnInterval = 52;
            camera.fov = 75;
            camera.updateProjectionMatrix();

            applyOceanTheme(oceanThemes[0]);
            
            player.position.set(lanes[currentLane], playerBaseY, 5);
            player.rotation.set(0, 0, 0); 
            
            shark.position.set(lanes[currentLane], 0.2, 9);
            shark.rotation.set(0, 0, 0);

            expValueSpan.innerText = exp;
            updateJumpUI();
            messageDisplay.style.display = "none";
            restartBtn.style.display = "none";
        });

        // --- 10. 메인 루프 ---
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.004;

            // 1) 실시간 3D 파도 출렁임 업데이트 (해역별 파도 세기 반영)
            waveScroll += isGameStarted && !isGameOver ? currentObsSpeed * 0.14 : 0.05;
            for (let i = 0; i < oceanPos.count; i++) {
                const bx = baseOceanCoords[i].x;
                const bz = baseOceanCoords[i].z;
                const edgeFactor = Math.min(1, Math.max(0.18, (Math.abs(bx) - 3.5) / 14));
                const waveY = (Math.sin(bx * 0.25 + time) * 0.6 + Math.cos(bz * 0.16 + waveScroll) * 0.7) * edgeFactor * currentWavePower;
                oceanPos.setY(i, waveY);
            }
            oceanPos.needsUpdate = true;
            oceanGeo.computeVertexNormals();

            // 물보라 파티클 애니메이션
            for (let i = wakeParticles.length - 1; i >= 0; i--) {
                const wp = wakeParticles[i];
                wp.mesh.position.x += wp.vx;
                wp.mesh.position.y += wp.vy;
                wp.mesh.position.z += wp.vz;
                wp.vy -= 0.003;
                wp.life -= 0.04;
                wp.mesh.material.opacity = Math.max(0, wp.life);
                wp.mesh.scale.setScalar(Math.max(0.1, wp.life));
                if (wp.life <= 0) {
                    scene.remove(wp.mesh);
                    wakeParticles.splice(i, 1);
                }
            }

            // 로비 화면 대기 애니메이션
            if (!isGameStarted) {
                player.position.y = playerBaseY + Math.sin(time * 1.2) * 0.07;
                player.rotation.x = Math.sin(time * 0.8) * 0.05;
                shark.position.y = 0.2 + Math.sin(time * 2) * 0.1;
                seaProps.forEach(item => {
                    item.mesh.position.y = Math.sin(time + item.phase) * 0.12;
                });
                renderer.render(scene, camera);
                return;
            }

            if (!isGameOver) {
                laneMarkerGroup.position.z += currentObsSpeed * 0.5;
                if (laneMarkerGroup.position.z > 4) laneMarkerGroup.position.z = 0;

                // 양옆 해상 오브젝트 스크롤 및 물결 흔들림
                seaProps.forEach(item => {
                    item.mesh.position.z += currentObsSpeed * 0.85;
                    item.mesh.position.y = Math.sin(time * 1.1 + item.phase) * 0.14 * currentWavePower;
                    if (item.mesh.position.z > 25) {
                        item.mesh.position.z = -230 - Math.random() * 40;
                    }
                });

                // 버튼 꾹 누르기 연속 차선 이동
                if (keysHeld.left || keysHeld.right) {
                    laneMoveTimer--;
                    if (laneMoveTimer <= 0) {
                        if (keysHeld.left && currentLane > 0) {
                            currentLane--;
                            player.rotation.z = 0.25;
                        } else if (keysHeld.right && currentLane < 2) {
                            currentLane++;
                            player.rotation.z = -0.25;
                        }
                        laneMoveTimer = laneMoveDelay;
                    }
                }
                
                if (!isJumping) {
                    player.position.y = playerBaseY + Math.sin(time * 1.3) * 0.06;
                    player.rotation.x = Math.sin(time * 0.9) * 0.05;
                    if (frameCount % 3 === 0) {
                        spawnWake(player.position.x, 0, player.position.z + 1.1, 0.8, 0.03);
                    }
                }
                player.position.x += (lanes[currentLane] - player.position.x) * 0.18;

                // 1단 & 2단 점프 물리
                if (isJumping) {
                    player.position.y += jumpVelocity;
                    jumpVelocity += gravity;

                    if (doubleJumpSpin > 0) {
                        const step = 0.28;
                        player.rotation.x -= step;
                        doubleJumpSpin -= step;
                        if (doubleJumpSpin <= 0) {
                            doubleJumpSpin = 0;
                            player.rotation.x = 0;
                        }
                    }
                    
                    if (player.position.y <= playerBaseY) {
                        player.position.y = playerBaseY;
                        player.rotation.x = 0;
                        isJumping = false;
                        jumpCount = 0;
                        doubleJumpSpin = 0;
                        updateJumpUI();
                    }
                }

                // 상어 추격 (해역 단계에 따라 배 뒤로 더 바짝 다가옴)
                shark.position.x += (player.position.x - shark.position.x) * 0.06; 
                shark.position.z += (targetSharkZ - shark.position.z) * 0.03;
                shark.rotation.z = Math.sin(time * 1.3) * 0.12; 
                shark.position.y = 0.2 + Math.sin(time * 2) * 0.1;

                frameCount++;
                if (frameCount % Math.floor(spawnInterval) === 0) spawnObstacle();

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.mesh.position.z += currentObsSpeed; 

                    if (obs.type === '상어') {
                        obs.mesh.rotation.z = Math.sin(time * 2 + obs.mesh.position.z) * 0.1;
                        if (!obs.isTall) {
                            obs.mesh.position.y = 0.2 + Math.sin(time * 3 + obs.mesh.position.z) * 0.2;
                        }
                    }

                    const requiredClearHeight = obs.isTall ? 3.1 : 1.5;
                    if (Math.abs(obs.mesh.position.z - player.position.z) < 1.45) {
                        if (obs.lane === currentLane && player.position.y < requiredClearHeight) {
                            isGameOver = true;
                            
                            if (obs.type === '부표') {
                                messageDisplay.innerHTML = "부표에<br>걸렸습니다!";
                            } else if (obs.type === '해파리') {
                                messageDisplay.innerHTML = "해파리에<br>걸렸습니다!";
                            } else {
                                messageDisplay.innerHTML = "상어에게<br>먹혔습니다!";
                            }
                            
                            messageDisplay.style.color = "#d90429";
                            messageDisplay.style.display = "block";
                            restartBtn.style.display = "block";
                        }
                    }

                    if (!obs.passed && obs.mesh.position.z > player.position.z + 1.5) {
                        obs.passed = true;
                        exp++;
                        expValueSpan.innerText = exp;
                        
                        currentObsSpeed = Math.min(2.1, currentObsSpeed + 0.025);
                        spawnInterval = Math.max(26, spawnInterval - 0.8);

                        if (camera.fov < 84) {
                            camera.fov += 0.25;
                            camera.updateProjectionMatrix();
                        }

                        if (exp % 10 === 0) {
                            const themeIdx = Math.floor(exp / 10) % oceanThemes.length;
                            const nextTheme = oceanThemes[themeIdx];
                            applyOceanTheme(nextTheme);
                            showZoneBanner(nextTheme.banner);
                        }
                    }

                    if (obs.mesh.position.z > 15) {
                        scene.remove(obs.mesh);
                        obstacles.splice(i, 1);
                    }
                }
            } else {
                if (shark.position.z > player.position.z - 0.5) {
                    shark.position.x += (player.position.x - shark.position.x) * 0.2; 
                    shark.position.z -= 0.3; 
                    shark.position.y += 0.08; 
                }

                if (player.position.y > -3) {
                    player.position.y -= 0.06; 
                    player.rotation.x -= 0.05; 
                    player.rotation.z += 0.1; 
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
