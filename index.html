<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>부캉이 피하기 3D</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #071928;
            font-family: '맑은 고딕', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #lobby-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(7, 25, 40, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 20;
            backdrop-filter: blur(6px);
            padding: 16px;
            overflow-y: auto;
            touch-action: pan-y;
        }

        #lobby-title {
            font-size: clamp(36px, 7vw, 62px);
            color: #00f5d4;
            font-weight: bold;
            text-shadow: 0 0 20px #00f5d4, 0 0 40px #0077b6;
            margin-bottom: 8px;
            text-align: center;
        }

        #lobby-desc {
            font-size: clamp(14px, 3.2vw, 18px);
            color: #e0f7fa;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 14px;
            text-shadow: 2px 2px 4px #000;
            width: 100%;
            max-width: 680px;
        }

        .controls-box {
            margin: 10px auto;
            padding: 10px 16px;
            background: rgba(0, 15, 30, 0.65);
            border: 1px solid rgba(0, 245, 212, 0.4);
            border-radius: 12px;
            display: inline-block;
            font-size: clamp(12px, 2.8vw, 15px);
            line-height: 1.7;
            text-align: left;
            max-width: 100%;
        }

        .lang-tag {
            color: #00f5d4;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            width: 58px;
        }

        .highlight { color: #ffb703; font-weight: bold; }

        /* 닉네임 입력창 & 랭킹 보드 컨테이너 */
        .lobby-panel {
            display: flex;
            gap: 16px;
            align-items: stretch;
            margin-bottom: 18px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 660px;
        }

        .nickname-box, .ranking-box {
            background: rgba(0, 18, 36, 0.85);
            border: 2px solid rgba(0, 245, 212, 0.5);
            border-radius: 14px;
            padding: 14px 20px;
            box-shadow: 0 0 18px rgba(0, 245, 212, 0.15);
            flex: 1 1 250px;
        }

        .nickname-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .panel-title {
            color: #00f5d4;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-align: center;
        }

        #nickname-input {
            width: 100%;
            max-width: 210px;
            padding: 10px 14px;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00f5d4;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
            user-select: text;
            -webkit-user-select: text;
        }

        #nickname-input::placeholder {
            color: rgba(224, 247, 250, 0.45);
            font-weight: normal;
        }

        #nickname-input:focus {
            background: rgba(0, 245, 212, 0.15);
            box-shadow: 0 0 12px #00f5d4;
        }

        .nickname-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #90e0ef;
        }

        #ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
            font-size: 15px;
            color: #e0f7fa;
        }

        #ranking-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #ranking-list li:last-child {
            border-bottom: none;
        }

        .rank-1 { color: #ffd166; font-weight: bold; }
        .rank-2 { color: #e0e1dd; font-weight: bold; }
        .rank-3 { color: #e09f3e; font-weight: bold; }

        #start-btn {
            padding: 13px 52px;
            font-size: clamp(20px, 4.5vw, 26px);
            font-weight: bold;
            color: #071928;
            background-color: #00f5d4;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #00f5d4;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        #start-btn:hover {
            background-color: #fff;
            box-shadow: 0 0 40px #fff;
            transform: scale(1.05);
        }

        #exp-display {
            position: absolute;
            top: 16px; left: 18px;
            color: #00f5d4;
            font-size: clamp(19px, 4vw, 24px);
            font-weight: bold;
            text-shadow: 2px 2px 6px #000;
            display: none;
        }

        #player-tag {
            color: #ffd166;
            font-size: clamp(14px, 3vw, 18px);
            margin-bottom: 2px;
        }

        #jump-indicator {
            position: absolute;
            top: 72px; left: 18px;
            color: #ffb703;
            font-size: clamp(13px, 3vw, 16px);
            font-weight: bold;
            text-shadow: 1px 1px 4px #000;
            display: none;
        }

        /* 인게임 우측 상단 1위 표시 */
        #best-hud {
            position: absolute;
            top: 16px; right: 18px;
            color: #ffd166;
            font-size: clamp(14px, 3.2vw, 20px);
            font-weight: bold;
            text-shadow: 2px 2px 6px #000;
            display: none;
            text-align: right;
        }

        #zone-banner {
            position: absolute;
            top: 20%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd166;
            font-size: clamp(22px, 5vw, 36px);
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 209, 102, 0.8), 2px 2px 0 #000;
            opacity: 0;
            transition: opacity 0.4s;
            text-align: center;
            width: 90%;
        }

        /* 모바일 & 터치 컨트롤 패드 */
        #mobile-controls {
            position: absolute;
            bottom: 24px;
            left: 0;
            width: 100%;
            padding: 0 22px;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 14;
        }

        .move-pad {
            display: flex;
            gap: 14px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(0, 245, 212, 0.18);
            border: 2.5px solid rgba(0, 245, 212, 0.65);
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
            touch-action: manipulation;
            cursor: pointer;
            transition: transform 0.08s, background 0.08s;
        }

        .touch-btn:active, .touch-btn.pressed {
            background: rgba(0, 245, 212, 0.5);
            transform: scale(0.92);
        }

        #btn-jump {
            width: 86px;
            height: 86px;
            background: rgba(255, 183, 3, 0.25);
            border-color: rgba(255, 183, 3, 0.85);
            color: #ffd166;
            font-size: 18px;
            flex-direction: column;
            line-height: 1.1;
            pointer-events: auto;
        }

        #btn-jump:active, #btn-jump.pressed {
            background: rgba(255, 183, 3, 0.58);
        }

        /* 게임 오버 결과 및 랭킹 오버레이 */
        #gameover-panel {
            position: absolute;
            top: 48%; left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            z-index: 18;
            width: 92%;
            max-width: 380px;
        }

        #message-display {
            font-size: clamp(36px, 7.5vw, 54px);
            font-weight: bold;
            text-shadow: 3px 3px 0px #000;
            text-align: center;
            margin-bottom: 12px;
        }

        #gameover-ranking {
            background: rgba(7, 25, 40, 0.92);
            border: 2px solid #00f5d4;
            border-radius: 14px;
            padding: 14px 22px;
            width: 100%;
            margin-bottom: 18px;
            color: #fff;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
        }

        #gameover-ranking h3 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #00f5d4;
            font-size: 19px;
        }

        #gameover-ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 16px;
        }

        #gameover-ranking-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        #gameover-ranking-list li:last-child {
            border-bottom: none;
        }

        .new-badge {
            background: #ff006e;
            color: #fff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .gameover-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        #restart-btn, #lobby-btn {
            padding: 13px 22px;
            font-size: clamp(17px, 4vw, 21px);
            font-weight: bold;
            color: #fff;
            border: 3px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        #restart-btn {
            background-color: #d90429;
            box-shadow: 0 0 15px #d90429;
        }

        #restart-btn:hover {
            background-color: #ffb703;
            box-shadow: 0 0 25px #ffb703;
            color: #071928;
            border-color: #071928;
        }

        #lobby-btn {
            background-color: #0077b6;
            box-shadow: 0 0 15px #0077b6;
        }

        #lobby-btn:hover {
            background-color: #00f5d4;
            box-shadow: 0 0 25px #00f5d4;
            color: #071928;
            border-color: #071928;
        }
    </style>
</head>
<body>
    <div id="lobby-screen">
        <div id="lobby-title">부캉이 피하기 3D</div>
        <div id="lobby-desc">
            출렁이는 바다 위, 상어를 피해 살아남으세요!
            <div class="controls-box">
                <div><span class="lang-tag">[PC]</span><span class="highlight">[A / D (꾹 누르기)] 연속 이동 &nbsp;|&nbsp; [Space x1~2] 1·2단 점프</span></div>
                <div><span class="lang-tag">[모바일]</span><span class="highlight">[◀ / ▶ 버튼(꾹 누르기)] 이동 &nbsp;|&nbsp; [JUMP] 점프 (스와이프 지원)</span></div>
            </div>
        </div>

        <div class="lobby-panel">
            <div class="nickname-box">
                <div class="panel-title">⚓ 선장 닉네임</div>
                <input type="text" id="nickname-input" maxlength="10" placeholder="닉네임 입력 (최대 10자)">
                <div class="nickname-hint">미입력 시 '항해사'로 출항합니다</div>
            </div>

            <div class="ranking-box">
                <div class="panel-title">🏆 실시간 랭킹 TOP 5</div>
                <ul id="ranking-list"></ul>
            </div>
        </div>

        <button id="start-btn">게임 시작</button>
    </div>

    <div id="ui-layer">
        <div id="exp-display">
            <div id="player-tag">선장: <span id="current-nickname">항해사</span></div>
            경험치: <span id="exp-value">0</span>
        </div>
        <div id="jump-indicator">점프: ● ●</div>
        <div id="best-hud">1위 기록: <span id="best-score-value">0점</span></div>
        <div id="zone-banner"></div>

        <!-- 모바일/터치 전용 하단 조작 버튼 -->
        <div id="mobile-controls">
            <div class="move-pad">
                <button type="button" class="touch-btn" id="btn-left" aria-label="왼쪽 이동">◀</button>
                <button type="button" class="touch-btn" id="btn-right" aria-label="오른쪽 이동">▶</button>
            </div>
            <button type="button" class="touch-btn" id="btn-jump" aria-label="점프">
                <span>▲</span>
                <span style="font-size: 13px;">JUMP</span>
            </button>
        </div>

        <div id="gameover-panel">
            <div id="message-display"></div>
            <div id="gameover-ranking">
                <h3>🏆 랭킹 TOP 5</h3>
                <ul id="gameover-ranking-list"></ul>
            </div>
            <div class="gameover-buttons">
                <button id="restart-btn">다시하기 [Enter]</button>
                <button id="lobby-btn">로비로</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 0. 닉네임 및 TOP 5 랭킹 시스템 ---
        const RANKING_STORAGE_KEY = 'bukang_avoid_3d_rankings_v2';
        const LAST_NICKNAME_KEY = 'bukang_avoid_3d_last_nick';

        const nicknameInput = document.getElementById('nickname-input');
        const rankingListEl = document.getElementById('ranking-list');
        const gameoverRankingListEl = document.getElementById('gameover-ranking-list');
        const currentNicknameSpan = document.getElementById('current-nickname');
        const bestHud = document.getElementById('best-hud');
        const bestScoreValueSpan = document.getElementById('best-score-value');

        let playerNickname = '항해사';

        const savedNick = localStorage.getItem(LAST_NICKNAME_KEY);
        if (savedNick) {
            nicknameInput.value = savedNick;
        }

        function loadRankings() {
            try {
                const raw = localStorage.getItem(RANKING_STORAGE_KEY) || localStorage.getItem('bukang_avoid_3d_rankings_v1');
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed)) return [];
                return parsed.sort((a, b) => b.score - a.score).slice(0, 5);
            } catch (e) {
                return [];
            }
        }

        function saveScoreToRanking(name, score) {
            const rankings = loadRankings();
            const existingIdx = rankings.findIndex(item => item.name === name);
            let isUpdated = false;

            if (existingIdx !== -1) {
                if (score > rankings[existingIdx].score) {
                    rankings[existingIdx].score = score;
                    isUpdated = true;
                }
            } else {
                rankings.push({ name: name, score: score });
                isUpdated = true;
            }

            rankings.sort((a, b) => b.score - a.score);
            const top5 = rankings.slice(0, 5);
            localStorage.setItem(RANKING_STORAGE_KEY, JSON.stringify(top5));

            const inTop5 = top5.some(item => item.name === name && item.score === score);
            return { top5, highlightName: (isUpdated && inTop5) ? name : null };
        }

        function renderRankingList(targetUl, rankings, highlightName = null) {
            targetUl.innerHTML = '';
            if (rankings.length === 0) {
                const li = document.createElement('li');
                li.style.justifyContent = 'center';
                li.style.color = '#90e0ef';
                li.innerText = '아직 랭킹 기록이 없습니다!';
                targetUl.appendChild(li);
                return;
            }

            const medals = ['🥇', '🥈', '🥉', '4위', '5위'];
            rankings.forEach((item, idx) => {
                const li = document.createElement('li');
                if (idx === 0) li.className = 'rank-1';
                else if (idx === 1) li.className = 'rank-2';
                else if (idx === 2) li.className = 'rank-3';

                const leftSpan = document.createElement('span');
                leftSpan.textContent = `${medals[idx]} ${item.name}`;

                if (highlightName && item.name === highlightName) {
                    const badge = document.createElement('span');
                    badge.className = 'new-badge';
                    badge.textContent = 'NEW';
                    leftSpan.appendChild(badge);
                }

                const rightSpan = document.createElement('span');
                rightSpan.textContent = `${item.score}점`;

                li.appendChild(leftSpan);
                li.appendChild(rightSpan);
                targetUl.appendChild(li);
            });
        }

        function updateBestHud() {
            const rankings = loadRankings();
            if (rankings.length > 0) {
                bestScoreValueSpan.innerText = `${rankings[0].score}점 (${rankings[0].name})`;
            } else {
                bestScoreValueSpan.innerText = '0점';
            }
        }

        renderRankingList(rankingListEl, loadRankings());
        updateBestHud();

        // --- 1. 3D 공간 및 화면 비율 대응 카메라 설정 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#0b4f6c');
        scene.fog = new THREE.FogExp2('#0b4f6c', 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        let baseFov = 75;

        function adjustCameraForScreen() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;
            if (aspect < 0.85) {
                baseFov = 86;
                camera.position.set(0, 6.2, 13.8);
            } else {
                baseFov = 75;
                camera.position.set(0, 5.2, 12.2);
            }
            camera.fov = baseFov;
            camera.lookAt(0, 0.5, 0);
            camera.updateProjectionMatrix();
        }
        adjustCameraForScreen();

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. 바다 조명 ---
        const ambientLight = new THREE.AmbientLight(0x8ecae6, 0.65);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xfff3b0, 0.95);
        directionalLight.position.set(15, 25, 12);
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0x00b4d8, 0.4);
        backLight.position.set(-15, 10, -20);
        scene.add(backLight);

        // --- 3. 3D 출렁이는 파도 & 해상 배경 오브젝트 ---
        const oceanGeo = new THREE.PlaneGeometry(180, 260, 44, 60);
        oceanGeo.rotateX(-Math.PI / 2);
        const oceanMat = new THREE.MeshStandardMaterial({
            color: '#0081a7',
            emissive: '#000000',
            roughness: 0.35,
            metalness: 0.1,
            flatShading: true
        });
        const ocean = new THREE.Mesh(oceanGeo, oceanMat);
        scene.add(ocean);

        const oceanPos = oceanGeo.attributes.position;
        const baseOceanCoords = [];
        for (let i = 0; i < oceanPos.count; i++) {
            baseOceanCoords.push({
                x: oceanPos.getX(i),
                z: oceanPos.getZ(i)
            });
        }

        const laneMarkerGroup = new THREE.Group();
        const foamMat = new THREE.MeshBasicMaterial({ color: 0xade8f4, transparent: true, opacity: 0.35 });
        for (let x of [-1.5, 1.5]) {
            for (let z = -110; z <= 15; z += 4) {
                const stripGeo = new THREE.BoxGeometry(0.12, 0.04, 1.6);
                const strip = new THREE.Mesh(stripGeo, foamMat);
                strip.position.set(x, 0.06, z);
                laneMarkerGroup.add(strip);
            }
        }
        scene.add(laneMarkerGroup);

        const seaProps = [];

        function createPalmIsland() {
            const group = new THREE.Group();

            const sandGeo = new THREE.CylinderGeometry(2.8, 3.8, 0.7, 9);
            const sandMat = new THREE.MeshStandardMaterial({ color: '#f4d58d', flatShading: true });
            const sand = new THREE.Mesh(sandGeo, sandMat);
            sand.position.y = 0.25;
            group.add(sand);

            const trunkMat = new THREE.MeshStandardMaterial({ color: '#7f4f24', flatShading: true });
            for (let i = 0; i < 4; i++) {
                const segGeo = new THREE.CylinderGeometry(0.22 - i * 0.02, 0.26 - i * 0.02, 1.1, 6);
                const seg = new THREE.Mesh(segGeo, trunkMat);
                seg.position.set(i * 0.14, 0.9 + i * 0.95, 0);
                seg.rotation.z = -0.12 * i;
                group.add(seg);
            }

            const leafMat = new THREE.MeshStandardMaterial({ color: '#52b788', flatShading: true });
            for (let i = 0; i < 6; i++) {
                const leafGeo = new THREE.ConeGeometry(0.55, 2.4, 4);
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                const angle = (i / 6) * Math.PI * 2;
                leaf.position.set(0.45 + Math.cos(angle) * 0.9, 4.3, Math.sin(angle) * 0.9);
                leaf.rotation.z = -Math.PI / 2.6;
                leaf.rotation.y = -angle;
                group.add(leaf);
            }

            return group;
        }

        function createSeaLighthouse() {
            const group = new THREE.Group();

            const baseGeo = new THREE.CylinderGeometry(1.8, 2.2, 0.8, 8);
            const baseMat = new THREE.MeshStandardMaterial({ color: '#2b2d42', flatShading: true });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.3;
            group.add(base);

            const redMat = new THREE.MeshStandardMaterial({ color: '#e63946', flatShading: true });
            const whiteMat = new THREE.MeshStandardMaterial({ color: '#f1faee', flatShading: true });
            for (let i = 0; i < 4; i++) {
                const towerGeo = new THREE.CylinderGeometry(1.1 - i * 0.15, 1.25 - i * 0.15, 1.2, 8);
                const tower = new THREE.Mesh(towerGeo, i % 2 === 0 ? redMat : whiteMat);
                tower.position.y = 1.2 + i * 1.15;
                group.add(tower);
            }

            const lightGeo = new THREE.SphereGeometry(0.55, 8, 8);
            const lightMat = new THREE.MeshBasicMaterial({ color: '#ffd166' });
            const beacon = new THREE.Mesh(lightGeo, lightMat);
