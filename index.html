<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>부캉이 피하기 3D</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #071928;
            font-family: '맑은 고딕', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #lobby-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(7, 25, 40, 0.82);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 20;
            backdrop-filter: blur(6px);
            padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
            overflow-y: auto;
            touch-action: pan-y;
        }

        #lobby-title {
            font-size: clamp(36px, 7vw, 62px);
            color: #00f5d4;
            font-weight: bold;
            text-shadow: 0 0 20px #00f5d4, 0 0 40px #0077b6;
            margin-bottom: 8px;
            text-align: center;
        }

        #lobby-desc {
            font-size: clamp(14px, 3.2vw, 18px);
            color: #e0f7fa;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 14px;
            text-shadow: 2px 2px 4px #000;
            width: 100%;
            max-width: 680px;
        }

        .controls-box {
            margin: 10px auto;
            padding: 10px 16px;
            background: rgba(0, 15, 30, 0.65);
            border: 1px solid rgba(0, 245, 212, 0.4);
            border-radius: 12px;
            display: inline-block;
            font-size: clamp(12px, 2.8vw, 15px);
            line-height: 1.7;
            text-align: left;
            max-width: 100%;
        }

        .lang-tag {
            color: #00f5d4;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            width: 58px;
        }

        .highlight { color: #ffb703; font-weight: bold; }

        /* 닉네임 입력창 & 랭킹 보드 컨테이너 */
        .lobby-panel {
            display: flex;
            gap: 16px;
            align-items: stretch;
            margin-bottom: 18px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 660px;
        }

        .nickname-box, .ranking-box {
            background: rgba(0, 18, 36, 0.85);
            border: 2px solid rgba(0, 245, 212, 0.5);
            border-radius: 14px;
            padding: 14px 20px;
            box-shadow: 0 0 18px rgba(0, 245, 212, 0.15);
            flex: 1 1 250px;
        }

        .nickname-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .panel-title {
            color: #00f5d4;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 4px;
            letter-spacing: 1px;
            text-align: center;
        }

        #sync-status {
            font-size: 11px;
            color: #90e0ef;
            text-align: center;
            margin-bottom: 8px;
        }

        #nickname-input {
            width: 100%;
            max-width: 210px;
            padding: 10px 14px;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00f5d4;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
            user-select: text;
            -webkit-user-select: text;
            margin-top: 6px;
        }

        #nickname-input::placeholder {
            color: rgba(224, 247, 250, 0.45);
            font-weight: normal;
        }

        #nickname-input:focus {
            background: rgba(0, 245, 212, 0.15);
            box-shadow: 0 0 12px #00f5d4;
        }

        .nickname-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #90e0ef;
        }

        #ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
            font-size: 15px;
            color: #e0f7fa;
        }

        #ranking-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #ranking-list li:last-child {
            border-bottom: none;
        }

        .rank-1 { color: #ffd166; font-weight: bold; }
        .rank-2 { color: #e0e1dd; font-weight: bold; }
        .rank-3 { color: #e09f3e; font-weight: bold; }

        #start-btn {
            padding: 13px 52px;
            font-size: clamp(20px, 4.5vw, 26px);
            font-weight: bold;
            color: #071928;
            background-color: #00f5d4;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #00f5d4;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        #start-btn:hover {
            background-color: #fff;
            box-shadow: 0 0 40px #fff;
            transform: scale(1.05);
        }

        #exp-display {
            position: absolute;
            top: calc(16px + env(safe-area-inset-top));
            left: 18px;
            color: #00f5d4;
            font-size: clamp(19px, 4vw, 24px);
            font-weight: bold;
            text-shadow: 2px 2px 6px #000;
            display: none;
        }

        #player-tag {
            color: #ffd166;
            font-size: clamp(14px, 3vw, 18px);
            margin-bottom: 2px;
        }

        #jump-indicator {
            position: absolute;
            top: calc(72px + env(safe-area-inset-top));
            left: 18px;
            color: #ffb703;
            font-size: clamp(13px, 3vw, 16px);
            font-weight: bold;
            text-shadow: 1px 1px 4px #000;
            display: none;
        }

        #best-hud {
            position: absolute;
            top: calc(16px + env(safe-area-inset-top));
            right: 18px;
            color: #ffd166;
            font-size: clamp(14px, 3.2vw, 20px);
            font-weight: bold;
            text-shadow: 2px 2px 6px #000;
            display: none;
            text-align: right;
        }

        #zone-banner {
            position: absolute;
            top: 20%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd166;
            font-size: clamp(22px, 5vw, 36px);
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 209, 102, 0.8), 2px 2px 0 #000;
            opacity: 0;
            transition: opacity 0.4s;
            text-align: center;
            width: 90%;
        }

        /* 모바일 & 터치 컨트롤 패드 */
        #mobile-controls {
            position: absolute;
            bottom: calc(24px + env(safe-area-inset-bottom));
            left: 0;
            width: 100%;
            padding: 0 22px;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 14;
        }

        .move-pad {
            display: flex;
            gap: 14px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(0, 245, 212, 0.18);
            border: 2.5px solid rgba(0, 245, 212, 0.65);
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
            touch-action: manipulation;
            cursor: pointer;
            transition: transform 0.08s, background 0.08s;
        }

        .touch-btn:active, .touch-btn.pressed {
            background: rgba(0, 245, 212, 0.5);
            transform: scale(0.92);
        }

        #btn-jump {
            width: 86px;
            height: 86px;
            background: rgba(255, 183, 3, 0.25);
            border-color: rgba(255, 183, 3, 0.85);
            color: #ffd166;
            font-size: 18px;
            flex-direction: column;
            line-height: 1.1;
            pointer-events: auto;
        }

        #btn-jump:active, #btn-jump.pressed {
            background: rgba(255, 183, 3, 0.58);
        }

        /* 게임 오버 결과 및 랭킹 오버레이 */
        #gameover-panel {
            position: absolute;
            top: 48%; left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            z-index: 18;
            width: 92%;
            max-width: 380px;
        }

        #message-display {
            font-size: clamp(36px, 7.5vw, 54px);
            font-weight: bold;
            text-shadow: 3px 3px 0px #000;
            text-align: center;
            margin-bottom: 12px;
        }

        #gameover-ranking {
            background: rgba(7, 25, 40, 0.92);
            border: 2px solid #00f5d4;
            border-radius: 14px;
            padding: 14px 22px;
            width: 100%;
            margin-bottom: 18px;
            color: #fff;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
        }

        #gameover-ranking h3 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #00f5d4;
            font-size: 19px;
        }

        #gameover-ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 16px;
        }

        #gameover-ranking-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        #gameover-ranking-list li:last-child {
            border-bottom: none;
        }

        .new-badge {
            background: #ff006e;
            color: #fff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .gameover-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        #restart-btn, #lobby-btn {
            padding: 13px 22px;
            font-size: clamp(17px, 4vw, 21px);
            font-weight: bold;
            color: #fff;
            border: 3px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        #restart-btn {
            background-color: #d90429;
            box-shadow: 0 0 15px #d90429;
        }

        #restart-btn:hover {
            background-color: #ffb703;
            box-shadow: 0 0 25px #ffb703;
            color: #071928;
            border-color: #071928;
        }

        #lobby-btn {
            background-color: #0077b6;
            box-shadow: 0 0 15px #0077b6;
        }

        #lobby-btn:hover {
            background-color: #00f5d4;
            box-shadow: 0 0 25px #00f5d4;
            color: #071928;
            border-color: #071928;
        }
    </style>
</head>
<body>
    <div id="lobby-screen">
        <div id="lobby-title">부캉이 피하기 3D</div>
        <div id="lobby-desc">
            출렁이는 바다 위, 상어를 피해 살아남으세요!
            <div class="controls-box">
                <div><span class="lang-tag">[PC]</span><span class="highlight">[A / D (꾹 누르기)] 연속 이동 &nbsp;|&nbsp; [Space x1~2] 1·2단 점프</span></div>
                <div><span class="lang-tag">[모바일]</span><span class="highlight">[◀ / ▶ 버튼(꾹 누르기)] 이동 &nbsp;|&nbsp; [JUMP] 점프 (스와이프 지원)</span></div>
            </div>
        </div>

        <div class="lobby-panel">
            <div class="nickname-box">
                <div class="panel-title">⚓ 선장 닉네임</div>
                <input type="text" id="nickname-input" maxlength="10" placeholder="닉네임 입력 (최대 10자)">
                <div class="nickname-hint">미입력 시 '항해사'로 출항합니다</div>
            </div>

            <div class="ranking-box">
                <div class="panel-title">🏆 실시간 랭킹 TOP 5</div>
                <div id="sync-status">연동 확인 중...</div>
                <ul id="ranking-list"></ul>
            </div>
        </div>

        <button id="start-btn">게임 시작</button>
    </div>

    <div id="ui-layer">
        <div id="exp-display">
            <div id="player-tag">선장: <span id="current-nickname">항해사</span></div>
            경험치: <span id="exp-value">0</span>
        </div>
        <div id="jump-indicator">점프: ● ●</div>
        <div id="best-hud">1위 기록: <span id="best-score-value">0점</span></div>
        <div id="zone-banner"></div>

        <!-- 모바일/터치 전용 하단 조작 버튼 -->
        <div id="mobile-controls">
            <div class="move-pad">
                <button type="button" class="touch-btn" id="btn-left" aria-label="왼쪽 이동">◀</button>
                <button type="button" class="touch-btn" id="btn-right" aria-label="오른쪽 이동">▶</button>
            </div>
            <button type="button" class="touch-btn" id="btn-jump" aria-label="점프">
                <span>▲</span>
                <span style="font-size: 13px;">JUMP</span>
            </button>
        </div>

        <div id="gameover-panel">
            <div id="message-display"></div>
            <div id="gameover-ranking">
                <h3>🏆 랭킹 TOP 5</h3>
                <ul id="gameover-ranking-list"></ul>
            </div>
            <div class="gameover-buttons">
                <button id="restart-btn">다시하기 [Enter]</button>
                <button id="lobby-btn">로비로</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 0. 닉네임 및 다중 브라우저/기기 영구 랭킹 시스템 ---
        // [필수 설정] PC와 모바일이 실시간으로 같은 랭킹을 공유하려면
        // 아래 따옴표 안에 Firebase Realtime Database 주소를 붙여넣으세요.
        // 예: "https://내프로젝트-default-rtdb.firebaseio.com"
        const RAW_CLOUD_URL = "";

        function normalizeCloudUrl(url) {
            const trimmed = (url || "").trim();
            if (!trimmed) return "";
            if (trimmed.endsWith(".json")) return trimmed;
            return trimmed.replace(/\/+$/, "") + "/bukang_rankings.json";
        }

        const CLOUD_RANKING_URL = normalizeCloudUrl(RAW_CLOUD_URL);

        const RANKING_STORAGE_KEY = 'bukang_avoid_3d_rankings_v3';
        const LAST_NICKNAME_KEY = 'bukang_avoid_3d_last_nick';
        const WINDOW_NAME_PREFIX = 'BUKANG_RANK_V3:';
        const IDB_NAME = 'BukangAvoid3DDB';
        const IDB_STORE = 'rankings';

        const nicknameInput = document.getElementById('nickname-input');
        const rankingListEl = document.getElementById('ranking-list');
        const syncStatusEl = document.getElementById('sync-status');
        const gameoverRankingListEl = document.getElementById('gameover-ranking-list');
        const currentNicknameSpan = document.getElementById('current-nickname');
        const bestHud = document.getElementById('best-hud');
        const bestScoreValueSpan = document.getElementById('best-score-value');

        let playerNickname = '항해사';
        let cachedRankings = [];

        function setSyncStatus(text, color = '#90e0ef') {
            if (!syncStatusEl) return;
            syncStatusEl.textContent = text;
            syncStatusEl.style.color = color;
        }

        try {
            const savedNick = localStorage.getItem(LAST_NICKNAME_KEY);
            if (savedNick) nicknameInput.value = savedNick;
        } catch (e) {}

        function mergeRankings(...lists) {
            const bestByName = new Map();
            lists.flat().forEach(item => {
                if (!item || typeof item.name !== 'string' || typeof item.score !== 'number') return;
                const cleanName = item.name.trim().slice(0, 10);
                if (!cleanName || isNaN(item.score)) return;
                const prev = bestByName.get(cleanName);
                if (prev === undefined || item.score > prev) {
                    bestByName.set(cleanName, item.score);
                }
            });
            return Array.from(bestByName.entries())
                .map(([name, score]) => ({ name, score }))
                .sort((a, b) => b.score - a.score);
        }

        // 저장소 1: localStorage
        function readFromLocalStorage() {
            try {
                const raw = localStorage.getItem(RANKING_STORAGE_KEY);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? mergeRankings(parsed) : [];
            } catch (e) {
                return [];
            }
        }

        function writeToLocalStorage(list) {
            try {
                localStorage.setItem(RANKING_STORAGE_KEY, JSON.stringify(list.slice(0, 20)));
            } catch (e) {}
        }

        // 저장소 2: IndexedDB
        function openRankingIDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) return reject();
                try {
                    const req = indexedDB.open(IDB_NAME, 1);
                    req.onupgradeneeded = () => {
                        const db = req.result;
                        if (!db.objectStoreNames.contains(IDB_STORE)) {
                            db.createObjectStore(IDB_STORE);
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject();
                } catch (e) {
                    reject();
                }
            });
        }

        async function readFromIDB() {
            try {
                const db = await openRankingIDB();
                return await new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE, 'readonly');
                    const store = tx.objectStore(IDB_STORE);
                    const getReq = store.get('top');
                    getReq.onsuccess = () => {
                        const val = getReq.result;
                        resolve(Array.isArray(val) ? mergeRankings(val) : []);
                    };
                    getReq.onerror = () => resolve([]);
                });
            } catch (e) {
                return [];
            }
        }

        async function writeToIDB(list) {
            try {
                const db = await openRankingIDB();
                const tx = db.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).put(list.slice(0, 20), 'top');
            } catch (e) {}
        }

        // 저장소 3: window.name
        function readFromWindowName() {
            try {
                if (typeof window.name === 'string' && window.name.startsWith(WINDOW_NAME_PREFIX)) {
                    const parsed = JSON.parse(window.name.slice(WINDOW_NAME_PREFIX.length));
                    return Array.isArray(parsed) ? mergeRankings(parsed) : [];
                }
            } catch (e) {}
            return [];
        }

        function writeToWindowName(list) {
            try {
                window.name = WINDOW_NAME_PREFIX + JSON.stringify(list.slice(0, 20));
            } catch (e) {}
        }

        // 저장소 4: URL 해시 (#r=...)
        function readFromUrlHash() {
            try {
                const hash = window.location.hash || '';
                const match = hash.match(/[#&]r=([A-Za-z0-9\-_]+)/);
                if (!match) return [];
                const b64 = match[1].replace(/-/g, '+').replace(/_/g, '/');
                const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
                const jsonStr = decodeURIComponent(escape(atob(padded)));
                const parsed = JSON.parse(jsonStr);
                if (!Array.isArray(parsed)) return [];
                return mergeRankings(parsed.map(pair => ({
                    name: Array.isArray(pair) ? pair[0] : pair.name,
                    score: Array.isArray(pair) ? pair[1] : pair.score
                })));
            } catch (e) {
                return [];
            }
        }

        function writeToUrlHash(list) {
            try {
                const compact = list.slice(0, 10).map(item => [item.name, item.score]);
                if (compact.length === 0) return;
                const jsonStr = JSON.stringify(compact);
                const b64 = btoa(unescape(encodeURIComponent(jsonStr)))
                    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                history.replaceState(null, '', '#r=' + b64);
            } catch (e) {}
        }

        // 저장소 5: 클라우드 데이터베이스
        async function fetchCloudRankings() {
            if (!CLOUD_RANKING_URL) {
                setSyncStatus('📱 기기 내 저장 모드 (서버 URL 미입력)', '#ffd166');
                return { ok: false, list: [] };
            }
            try {
                const res = await fetch(CLOUD_RANKING_URL, { cache: 'no-store' });
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        setSyncStatus('⚠️ Firebase 읽기 권한 차단됨 (규칙 확인)', '#ff6b6b');
                    } else {
                        setSyncStatus(`⚠️ 서버 응답 오류 (${res.status})`, '#ff6b6b');
                    }
                    return { ok: false, list: [] };
                }
                const data = await res.json();
                setSyncStatus('🌐 PC·모바일 전체 기기 연동됨', '#00f5d4');
                if (!data) return { ok: true, list: [] };
                if (Array.isArray(data)) return { ok: true, list: mergeRankings(data) };
                if (typeof data === 'object') return { ok: true, list: mergeRankings(Object.values(data)) };
                return { ok: true, list: [] };
            } catch (e) {
                setSyncStatus('⚠️ 서버 연결 실패 (주소/인터넷 확인)', '#ff6b6b');
                return { ok: false, list: [] };
            }
        }

        async function pushCloudRankings(mergedList) {
            if (!CLOUD_RANKING_URL || mergedList.length === 0) return;
            try {
                const res = await fetch(CLOUD_RANKING_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(mergedList.slice(0, 20))
                });
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {

        function persistAllLocalLayers(list) {
            cachedRankings = list;
            writeToLocalStorage(list);

            writeToWindowName(list);
            writeToUrlHash(list);
        }

        function renderRankingList(targetUl, rankings, highlightName = null) {
            const top5 = rankings.slice(0, 5);
            targetUl.innerHTML = '';
            if (top5.length === 0) {
                const li = document.createElement('li');
                li.style.justifyContent = 'center';
                li.style.color = '#90e0ef';
                li.innerText = '아직 랭킹 기록이 없습니다!';
                targetUl.appendChild(li);
                return;
            }

            const medals = ['🥇', '🥈', '🥉', '4위', '5위'];
            top5.forEach((item, idx) => {
                const li = document.createElement('li');
                if (idx === 0) li.className = 'rank-1';
                else if (idx === 1) li.className = 'rank-2';
                else if (idx === 2) li.className = 'rank-3';

                const leftSpan = document.createElement('span');
                leftSpan.textContent = `${medals[idx]} ${item.name}`;

                if (highlightName && item.name === highlightName) {
                    const badge = document.createElement('span');
                    badge.className = 'new-badge';
                    badge.textContent = 'NEW';
                    leftSpan.appendChild(badge);
                }

                const rightSpan = document.createElement('span');
                rightSpan.textContent = `${item.score}점`;

                li.appendChild(leftSpan);
                li.appendChild(rightSpan);
                targetUl.appendChild(li);
            });
        }

        function updateBestHud(rankings = null) {
            const list = rankings || cachedRankings;
            if (list.length > 0) {

            } else {
                bestScoreValueSpan.innerText = '0점';
            }
        }

        async function syncAllRankings() {
            const syncLocal = mergeRankings(
                cachedRankings,
                readFromLocalStorage(),
                readFromWindowName(),
                readFromUrlHash()
            );
            cachedRankings = syncLocal;
            renderRankingList(rankingListEl, syncLocal);
            updateBestHud(syncLocal);

            const idbList = await readFromIDB();
            const mergedLocal = mergeRankings(cachedRankings, idbList);
            persistAllLocalLayers(mergedLocal);
            renderRankingList(rankingListEl, mergedLocal);
            updateBestHud(mergedLocal);

            const cloudRes = await fetchCloudRankings();
            if (!cloudRes.ok) return mergedLocal;

            const cloudList = cloudRes.list;
            const fullMerged = mergeRankings(mergedLocal, cloudList);
            persistAllLocalLayers(fullMerged);
            renderRankingList(rankingListEl, fullMerged);
            updateBestHud(fullMerged);

            if (fullMerged.length > cloudList.length || JSON.stringify(fullMerged.slice(0, 5)) !== JSON.stringify(cloudList.slice(0, 5))) {
                pushCloudRankings(fullMerged);
            }
            return fullMerged;
        }

        async function saveScoreToRanking(name, score) {
            const idbList = await readFromIDB();
            const prevMerged = mergeRankings(
                cachedRankings,
                readFromLocalStorage(),
                readFromWindowName(),
                readFromUrlHash(),
                idbList
            );

            const prevRecord = prevMerged.find(item => item.name === name);
            const isPersonalBest = !prevRecord || score > prevRecord.score;

            const immediateMerged = mergeRankings(prevMerged, [{ name, score }]);
            persistAllLocalLayers(immediateMerged);

            const inTop5Immediate = immediateMerged.slice(0, 5).some(item => item.name === name && item.score === score);
            const highlightName = (isPersonalBest && inTop5Immediate) ? name : null;

            renderRankingList(gameoverRankingListEl, immediateMerged, highlightName);
            renderRankingList(rankingListEl, immediateMerged);
            updateBestHud(immediateMerged);

            if (CLOUD_RANKING_URL) {
                const cloudRes = await fetchCloudRankings();
                const cloudList = cloudRes.ok ? cloudRes.list : [];
                const fullMerged = mergeRankings(immediateMerged, cloudList);
                persistAllLocalLayers(fullMerged);
                await pushCloudRankings(fullMerged);

                const inTop5Cloud = fullMerged.slice(0, 5).some(item => item.name === name && item.score === score);
                renderRankingList(gameoverRankingListEl, fullMerged, (isPersonalBest && inTop5Cloud) ? name : null);
                renderRankingList(rankingListEl, fullMerged);
                updateBestHud(fullMerged);
            }
        }

            const rawNick = nicknameInput.value.trim();
            playerNickname = rawNick.length > 0 ? rawNick : '항해사';
            try { localStorage.setItem(LAST_NICKNAME_KEY, rawNick); } catch (e) {}
            currentNicknameSpan.innerText = playerNickname;

            resetGameWorld();
            lobbyScreen.style.display = 'none';
            expDisplay.style.display = 'block';
            jumpIndicator.style.display = 'block';
            bestHud.style.display = 'block';
            mobileControls.style.display = 'flex';
            isGameStarted = true;
        }

        // --- 7. PC 키보드 & 모바일 터치/스와이프 이벤트 ---
        startBtn.addEventListener('click', startGameFromLobby);

        nicknameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                startGameFromLobby();
            }
        });

        function bindHoldButton(btn, setter) {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                setter(true);
            });
            const release = (e) => {
                e.preventDefault();
                setter(false);
            };
            btn.addEventListener('pointerup', release);
            btn.addEventListener('pointercancel', release);
            btn.addEventListener('pointerleave', release);
        }

        bindHoldButton(btnLeft, setHoldLeft);
        bindHoldButton(btnRight, setHoldRight);

        btnJump.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            btnJump.classList.add('pressed');
            triggerJump();
        });
        const releaseJumpBtn = () => btnJump.classList.remove('pressed');
        btnJump.addEventListener('pointerup', releaseJumpBtn);
        btnJump.addEventListener('pointercancel', releaseJumpBtn);
        btnJump.addEventListener('pointerleave', releaseJumpBtn);

        let touchStartX = 0;
        let touchStartY = 0;
        let swipeHandled = false;

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (!isGameStarted || isGameOver) return;
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            swipeHandled = false;
        }, { passive: true });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (!isGameStarted || isGameOver || swipeHandled) return;
            const t = e.touches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            const threshold = 28;

            if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                swipeHandled = true;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx < 0) moveLeftOnce();
                    else moveRightOnce();
                    setTimeout(() => {
                        if (!keysHeld.left && !keysHeld.right && !isGameOver) player.rotation.z = 0;
                    }, 160);
                } else if (dy < 0) {
                    triggerJump();
                }
            }
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
            if (isGameOver && e.key === 'Enter') {
                restartBtn.click();
                return;
            }

            if (!isGameStarted || isGameOver) return;

            const key = e.key.toLowerCase();

            if (key === 'a' || e.key === 'ArrowLeft') {
                setHoldLeft(true);
            } else if (key === 'd' || e.key === 'ArrowRight') {
                setHoldRight(true);
            } else if (e.code === 'Space' && !e.repeat) {
                triggerJump();
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || e.key === 'ArrowLeft') {
                setHoldLeft(false);
            }
            if (key === 'd' || e.key === 'ArrowRight') {
                setHoldRight(false);
            }
        });

        // --- 8. 1층 및 2층 장애물 생성 함수 ---
        function createBuoy(isTall) {
            const group = new THREE.Group();
            const redMat = new THREE.MeshStandardMaterial({ color: '#d90429', flatShading: true });
            const whiteMat = new THREE.MeshStandardMaterial({ color: '#ffffff', flatShading: true });
            const goldMat = new THREE.MeshBasicMaterial({ color: '#ffb703' });

            const count = isTall ? 2 : 1;
            for (let i = 0; i < count; i++) {
                const offsetY = i * 1.75;
                const baseGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 12);
                const base = new THREE.Mesh(baseGeo, redMat);
                base.position.y = 0.5 + offsetY;
                group.add(base);

                const stripeGeo = new THREE.CylinderGeometry(0.52, 0.52, 0.3, 12);
                const stripe = new THREE.Mesh(stripeGeo, whiteMat);
                stripe.position.y = 0.5 + offsetY;
                group.add(stripe);

                const topGeo = new THREE.ConeGeometry(0.5, 0.9, 12);
                const top = new THREE.Mesh(topGeo, i === 1 ? goldMat : redMat);
                top.position.y = 1.45 + offsetY;
                group.add(top);
            }

            return group;
        }

        function createJellyfish(isTall) {
            const group = new THREE.Group();
            const jellyMat = new THREE.MeshStandardMaterial({ 
                color: isTall ? '#ff006e' : '#b5179e', 
                transparent: true, 
                opacity: 0.85,
                flatShading: true
            });

            const count = isTall ? 2 : 1;
            for (let c = 0; c < count; c++) {
                const offsetY = c * 1.7;
                const headGeo = new THREE.SphereGeometry(0.7, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2);
                const head = new THREE.Mesh(headGeo, jellyMat);
                head.position.y = 1.2 + offsetY;
                group.add(head);

                const legGeo = new THREE.CylinderGeometry(0.05, 0.05, 1);
                for (let i = 0; i < 4; i++) {
                    const leg = new THREE.Mesh(legGeo, jellyMat);
                    leg.position.x = Math.cos((i / 4) * Math.PI * 2) * 0.3;
                    leg.position.z = Math.sin((i / 4) * Math.PI * 2) * 0.3;
                    leg.position.y = 0.5 + offsetY;
                    group.add(leg);
                }
            }
            return group;
        }

        function spawnObstacle() {
            if (!isGameStarted || isGameOver) return;
            
            const laneIdx = Math.floor(Math.random() * 3);
            const rand = Math.random();
            const isTall = exp >= 3 && Math.random() < 0.38;
            let obsMesh, obsType;
            
            if (rand < 0.33) {
                obsMesh = createBuoy(isTall);
                obsType = '부표';
            } else if (rand < 0.66) {
                obsMesh = createJellyfish(isTall);
                obsType = '해파리';
            } else {
                obsMesh = createObstacleShark(isTall);
                obsType = '상어';
            }
            
            obsMesh.position.set(lanes[laneIdx], 0, -85); 
            scene.add(obsMesh);
            
            obstacles.push({ 
                mesh: obsMesh, 
                lane: laneIdx, 
                passed: false, 
                type: obsType,
                isTall: isTall
            });
        }

        const oceanThemes = [
            {
                bg: '#0b4f6c',
                water: '#0081a7',
                emissive: '#000000',
                sun: '#fff3b0',
                wavePower: 1.0,
                sharkZ: 9.0,
                banner: '산호초 맑은 바다'
            },
            {
                bg: '#4a1942',
                water: '#893168',
                emissive: '#1a0514',
                sun: '#ff9e00',
                wavePower: 1.35,
                sharkZ: 8.6,
                banner: '붉은 노을 해협 (파도 상승!)'
            },
            {
                bg: '#1b263b',
                water: '#0d1b2a',
                emissive: '#000000',
                sun: '#778da9',
                wavePower: 2.1,
                sharkZ: 8.2,
                banner: '폭풍우 소용돌이 해역 (거친 파도!)'
            },
            {
                bg: '#03071e',
                water: '#003566',
                emissive: '#003f5c',
                sun: '#00f5d4',
                wavePower: 1.6,
                sharkZ: 7.8,
                banner: '발광 심연 (상어가 바짝 추격합니다!)'
            }
        ];

        function applyOceanTheme(theme) {
            scene.background.set(theme.bg);
            scene.fog.color.set(theme.bg);
            oceanMat.color.set(theme.water);
            oceanMat.emissive.set(theme.emissive);
            directionalLight.color.set(theme.sun);
            currentWavePower = theme.wavePower;
            targetSharkZ = theme.sharkZ;
        }

        function showZoneBanner(text) {
            zoneBanner.innerText = text;
            zoneBanner.style.opacity = '1';
            setTimeout(() => {
                zoneBanner.style.opacity = '0';
            }, 2200);
        }

        function handleGameOver(obsType) {
            isGameOver = true;
            setHoldLeft(false);
            setHoldRight(false);
            mobileControls.style.display = 'none';

            if (obsType === '부표') {
                messageDisplay.innerHTML = "부표에 걸렸습니다!";
            } else if (obsType === '해파리') {
                messageDisplay.innerHTML = "해파리에 걸렸습니다!";
            } else {
                messageDisplay.innerHTML = "상어에게 먹혔습니다!";
            }
            messageDisplay.style.color = "#d90429";

            saveScoreToRanking(playerNickname, exp);
            gameoverPanel.style.display = 'flex';
        }

        // --- 9. 다시하기 & 로비로 기능 ---
        restartBtn.addEventListener('click', () => {
            resetGameWorld();
        });

        lobbyBtn.addEventListener('click', () => {
            resetGameWorld();
            isGameStarted = false;
            expDisplay.style.display = 'none';
            jumpIndicator.style.display = 'none';
            bestHud.style.display = 'none';
            mobileControls.style.display = 'none';
            syncAllRankings();
            lobbyScreen.style.display = 'flex';
        });

        // --- 10. 메인 루프 (60fps 기준 프레임 보정 적용) ---
        let lastFrameTime = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);

            const rawDt = (now - lastFrameTime) / (1000 / 60);
            lastFrameTime = now;
            const dt = Math.min(Math.max(rawDt, 0.1), 2.5);

            const time = now * 0.004;

            waveScroll += (isGameStarted && !isGameOver ? currentObsSpeed * 0.14 : 0.05) * dt;
            for (let i = 0; i < oceanPos.count; i++) {
                const bx = baseOceanCoords[i].x;
                const bz = baseOceanCoords[i].z;
                const edgeFactor = Math.min(1, Math.max(0.18, (Math.abs(bx) - 3.5) / 14));
                const waveY = (Math.sin(bx * 0.25 + time) * 0.6 + Math.cos(bz * 0.16 + waveScroll) * 0.7) * edgeFactor * currentWavePower;
                oceanPos.setY(i, waveY);
            }
            oceanPos.needsUpdate = true;
            oceanGeo.computeVertexNormals();

            for (let i = wakeParticles.length - 1; i >= 0; i--) {
                const wp = wakeParticles[i];
                wp.mesh.position.x += wp.vx * dt;
                wp.mesh.position.y += wp.vy * dt;
                wp.mesh.position.z += wp.vz * dt;
                wp.vy -= 0.003 * dt;
                wp.life -= 0.04 * dt;
                wp.mesh.material.opacity = Math.max(0, wp.life);
                wp.mesh.scale.setScalar(Math.max(0.1, wp.life));
                if (wp.life <= 0) {
                    scene.remove(wp.mesh);
                    wakeParticles.splice(i, 1);
                }
            }

            if (!isGameStarted) {
                player.position.y = playerBaseY + Math.sin(time * 1.2) * 0.07;
                player.rotation.x = Math.sin(time * 0.8) * 0.05;
                shark.position.y = 0.2 + Math.sin(time * 2) * 0.1;
                seaProps.forEach(item => {
                    item.mesh.position.y = Math.sin(time + item.phase) * 0.12;
                });
                renderer.render(scene, camera);
                return;
            }

            if (!isGameOver) {
                laneMarkerGroup.position.z += currentObsSpeed * 0.5 * dt;
                if (laneMarkerGroup.position.z > 4) laneMarkerGroup.position.z %= 4;

                seaProps.forEach(item => {
                    item.mesh.position.z += currentObsSpeed * 0.85 * dt;
                    item.mesh.position.y = Math.sin(time * 1.1 + item.phase) * 0.14 * currentWavePower;
                    if (item.mesh.position.z > 25) {
                        item.mesh.position.z = -230 - Math.random() * 40;
                    }
                });

                if (keysHeld.left || keysHeld.right) {
                    laneMoveTimer -= dt;
                    if (laneMoveTimer <= 0) {
                        if (keysHeld.left) moveLeftOnce();
                        else if (keysHeld.right) moveRightOnce();
                        laneMoveTimer = laneMoveDelay;
                    }
                }
                
                if (!isJumping) {
                    player.position.y = playerBaseY + Math.sin(time * 1.3) * 0.06;
                    player.rotation.x = Math.sin(time * 0.9) * 0.05;
                    wakeTimer += dt;
                    if (wakeTimer >= 3) {
                        wakeTimer = 0;
                        spawnWake(player.position.x, 0, player.position.z + 1.1, 0.8, 0.03);
                    }
                }
                const laneLerp = 1 - Math.pow(1 - 0.18, dt);
                player.position.x += (lanes[currentLane] - player.position.x) * laneLerp;

                if (isJumping) {
                    player.position.y += jumpVelocity * dt;
                    jumpVelocity += gravity * dt;

                    if (doubleJumpSpin > 0) {
                        const step = 0.28 * dt;
                        player.rotation.x -= step;
                        doubleJumpSpin -= step;
                        if (doubleJumpSpin <= 0) {
                            doubleJumpSpin = 0;
                            player.rotation.x = 0;
                        }
                    }
                    
                    if (player.position.y <= playerBaseY) {
                        player.position.y = playerBaseY;
                        player.rotation.x = 0;
                        isJumping = false;
                        jumpCount = 0;
                        doubleJumpSpin = 0;
                        updateJumpUI();
                    }
                }

                const sharkLerpX = 1 - Math.pow(1 - 0.06, dt);
                const sharkLerpZ = 1 - Math.pow(1 - 0.03, dt);
                shark.position.x += (player.position.x - shark.position.x) * sharkLerpX; 
                shark.position.z += (targetSharkZ - shark.position.z) * sharkLerpZ;
                shark.rotation.z = Math.sin(time * 1.3) * 0.12; 
                shark.position.y = 0.2 + Math.sin(time * 2) * 0.1;

                spawnTimer += dt;
                if (spawnTimer >= spawnInterval) {
                    spawnTimer -= spawnInterval;
                    spawnObstacle();
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.mesh.position.z += currentObsSpeed * dt; 

                    if (obs.type === '상어') {
                        obs.mesh.rotation.z = Math.sin(time * 2 + obs.mesh.position.z) * 0.1;
                        if (!obs.isTall) {
                            obs.mesh.position.y = 0.2 + Math.sin(time * 3 + obs.mesh.position.z) * 0.2;
                        }
                    }

                    const requiredClearHeight = obs.isTall ? 3.1 : 1.5;
                    if (Math.abs(obs.mesh.position.z - player.position.z) < 1.45) {
                        if (obs.lane === currentLane && player.position.y < requiredClearHeight) {
                            handleGameOver(obs.type);
                        }
                    }

                    if (!obs.passed && obs.mesh.position.z > player.position.z + 1.5) {
                        obs.passed = true;
                        exp++;
                        expValueSpan.innerText = exp;
                        
                        currentObsSpeed = Math.min(MAX_OBS_SPEED, currentObsSpeed + SPEED_STEP);
                        spawnInterval = Math.max(MIN_SPAWN_INTERVAL, spawnInterval - SPAWN_STEP);

                        if (camera.fov < baseFov + 9) {
                            camera.fov += 0.2;
                            camera.updateProjectionMatrix();
                        }

                        if (exp % 10 === 0) {
                            const themeIdx = Math.floor(exp / 10) % oceanThemes.length;
                            const nextTheme = oceanThemes[themeIdx];
                            applyOceanTheme(nextTheme);
                            showZoneBanner(nextTheme.banner);
                        }
                    }

                    if (obs.mesh.position.z > 15) {
                        scene.remove(obs.mesh);
                        obstacles.splice(i, 1);
                    }
                }
            } else {
                if (shark.position.z > player.position.z - 0.5) {
                    const endLerp = 1 - Math.pow(1 - 0.2, dt);
                    shark.position.x += (player.position.x - shark.position.x) * endLerp; 
                    shark.position.z -= 0.3 * dt; 
                    shark.position.y += 0.08 * dt; 
                }

                if (player.position.y > -3) {
                    player.position.y -= 0.06 * dt; 
                    player.rotation.x -= 0.05 * dt; 
                    player.rotation.z += 0.1 * dt; 
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            adjustCameraForScreen();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
